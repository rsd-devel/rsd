# This test profile does not describe every RSD feature.
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: rsd-rv32i
description: RSD integer and synchronous exception tests in machine mode
implemented_extensions:
  - { name: I, version: "= 2.1" }
  - { name: M, version: "= 2.0" }
  - { name: Zmmul, version: "= 1.0.0" }
  - { name: A, version: "= 2.1.0" }
  - { name: Zaamo, version: "= 1.0.0" }
  - { name: Zalrsc, version: "= 1.0.0" }
  - { name: Zicsr, version: "= 2.0" }
  # Zifencei is added by the Makefile only when explicitly selected.
  - { name: Sm, version: "= 1.11.0" }
params:
  MXLEN: 32
  PHYS_ADDR_WIDTH: 32
  M_MODE_ENDIANNESS: little
  MISA_CSR_IMPLEMENTED: true
  MUTABLE_MISA_M: false
  MUTABLE_MISA_A: false
  MISALIGNED_AMO: false
  # RSD reserves one word and checks the complete physical address on SC.
  LRSC_RESERVATION_STRATEGY: "reserve exactly enough to cover the access"
  LRSC_FAIL_ON_NON_EXACT_LRSC: true
  LRSC_FAIL_ON_VA_SYNONYM: false
  LRSC_MISALIGNED_BEHAVIOR: "always raise misaligned exception"
  NON_STANDARD_EXTENSION_IMPLEMENTED: false
  PRECISE_SYNCHRONOUS_EXCEPTIONS: true
  TRAP_ON_ECALL_FROM_M: true
  TRAP_ON_EBREAK: true
  TRAP_ON_UNIMPLEMENTED_INSTRUCTION: true
  TRAP_ON_RESERVED_INSTRUCTION: true
  TRAP_ON_UNIMPLEMENTED_CSR: true
  TRAP_ON_ILLEGAL_WLRL: false
  # The current decoder treats WFI as a NOP in every privilege mode.
  WFI_FINITE: true
  WFI_U_MODE: true
  # The simulation adapter cannot inject an external interrupt.
  MEI_INTR_IMPL: false
  MSI_INTR_IMPL: true
  MTI_INTR_IMPL: true
  REPORT_VA_IN_MTVAL_ON_BREAKPOINT: false
  REPORT_VA_IN_MTVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_LOAD_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_ACCESS_FAULT: true
  # Fetch access faults carry no data address through the memory pipeline.
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_ACCESS_FAULT: false
  # Report zero instead of retaining instruction encodings in the pipeline.
  REPORT_ENCODING_IN_MTVAL_ON_ILLEGAL_INSTRUCTION: false
  MTVAL_WIDTH: 32
  MISALIGNED_LDST: false
  # MemoryTagAccessStage checks the memory map before address alignment.
  MISALIGNED_LDST_EXCEPTION_PRIORITY: low
  MARCHID_IMPLEMENTED: false
  MIMPID_IMPLEMENTED: false
  VENDOR_ID_BANK: 0
  VENDOR_ID_OFFSET: 0
  PMA_GRANULARITY: 2
  MTVEC_ACCESS: rw
  MTVEC_MODES: [0, 1]
  MTVEC_ILLEGAL_WRITE_BEHAVIOR: custom
  MTVEC_BASE_ALIGNMENT_DIRECT: 4
  MTVEC_BASE_ALIGNMENT_VECTORED: 4
  MCOUNTINHIBIT_IMPLEMENTED: false
  HPM_COUNTER_EN: [false, false, false, false, false, false, false, false,
    false, false, false, false, false, false, false, false,
    false, false, false, false, false, false, false, false,
    false, false, false, false, false, false, false, false]
  MCOUNTENABLE_EN: [false, false, false, false, false, false, false, false,
    false, false, false, false, false, false, false, false,
    false, false, false, false, false, false, false, false,
    false, false, false, false, false, false, false, false]
  NUM_PMP_ENTRIES: 0
